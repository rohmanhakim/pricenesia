# =============================================================================
# Pricenesia Ingestion API Worker
# =============================================================================

name = "pricenesia-ingestion-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# =============================================================================
# D1 Database
# =============================================================================
[[d1_databases]]
binding = "DB"
database_name = "pricenesia-db"
database_id = "f7dd5837-bcf3-4e39-b5af-99dd8fe6978f"
migrations_dir = "../../migrations"

# =============================================================================
# Service Binding (to scraper worker)
# =============================================================================
[[services]]
binding = "SCRAPER_SERVICE"
service = "pricenesia-scraper"

# =============================================================================
# Environment Variables
# =============================================================================
[vars]
ENVIRONMENT = "development"

# =============================================================================
# Secrets (set via: wrangler secret put)
# =============================================================================
# ADMIN_API_KEY - API key for authenticating requests
